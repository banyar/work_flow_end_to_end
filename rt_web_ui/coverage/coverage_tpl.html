<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AC Unit Coverage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap">
<style>
/* Same tokens as the acceptance page. One row per acceptance criterion; a row
   opens to show the code that implements it and the unit tests that assert it. */
:root {
  --bg: #f3f5f4; --panel: #ffffff; --fg: #17201d; --muted: #5d6b66; --line: #d9e0dd;
  --accent: #0b6e5f; --accent-ink: #ffffff; --accent-soft: #e2f1ee;
  --ok: #1d7a3a; --ok-soft: #e3f3e8; --warn: #9a5b00; --warn-soft: #fbf0dc;
  --bad: #b3261e; --bad-soft: #fbe6e4; --info: #2a5db0; --info-soft: #e5edfa;
  --code: #eef2f0;
  --font-ui: "IBM Plex Sans", "Noto Sans Myanmar", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --panel: #161e1c; --fg: #e3ebe8; --muted: #93a39e; --line: #2a3532;
    --accent: #3fb8a3; --accent-ink: #062520; --accent-soft: #173a34;
    --ok: #63c27d; --ok-soft: #173322; --warn: #e0a447; --warn-soft: #3a2a10;
    --bad: #f08b83; --bad-soft: #3d1a17; --info: #86aef0; --info-soft: #182540;
    --code: #1d2826; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --panel: #161e1c; --fg: #e3ebe8; --muted: #93a39e; --line: #2a3532;
  --accent: #3fb8a3; --accent-ink: #062520; --accent-soft: #173a34;
  --ok: #63c27d; --ok-soft: #173322; --warn: #e0a447; --warn-soft: #3a2a10;
  --bad: #f08b83; --bad-soft: #3d1a17; --info: #86aef0; --info-soft: #182540;
  --code: #1d2826; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; padding: 24px 16px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h1 small { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
header a { color: var(--accent); font-size: 13px; }
.head-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; background: var(--panel); }
.lang button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; padding: 3px 12px; border-radius: 99px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.env { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.env b { color: var(--fg); font-weight: 500; }
.note { background: var(--info-soft); color: var(--fg); border-radius: var(--r); padding: 10px 14px; font-size: 13px; }
.note ul { margin: 4px 0 0; padding-left: 20px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }

.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.summary > button { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.summary > button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.summary .k { font-size: 12px; color: var(--muted); }
.summary .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); }
.meter span { display: block; height: 100%; }
@media (max-width: 760px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 99px; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.tabs button .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); margin-left: 6px; }
.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tabs button[aria-selected="true"] .n { color: var(--accent-ink); opacity: 0.8; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar .grow { flex: 1; min-width: 160px; }
.bar input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; }
.story-head { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.story-head b { color: var(--fg); }

.scroll { overflow-x: auto; }
.cases { width: 100%; border-collapse: collapse; }
.cases th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.cases td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cases tr.row { cursor: pointer; }
.cases tr.row:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.cases tr.row.open td { background: var(--accent-soft); }
.id { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
.sub { display: block; color: var(--muted); font-size: 12.5px; }
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.p-covered { background: var(--ok-soft); color: var(--ok); }
.p-partial { background: var(--warn-soft); color: var(--warn); }
.p-none { background: var(--bad-soft); color: var(--bad); }
.p-not_built { background: var(--line); color: var(--muted); }
.num { font-family: var(--font-mono); font-size: 12.5px; text-align: right; white-space: nowrap; }

.detail td { background: var(--bg); padding: 14px 16px 18px; }
.det { display: grid; gap: 14px; }
.det h4 { margin: 0 0 4px; font-size: 12.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.det p { margin: 0; }
.gap { background: var(--warn-soft); border-radius: 6px; padding: 8px 12px; }
.gap.none { background: var(--bad-soft); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.code { font-family: var(--font-mono); font-size: 12px; background: var(--code); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.repo { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-right: 6px; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .dim { color: var(--muted); }
.empty { color: var(--muted); font-style: italic; }
.needs li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; }
.needs li .where { grid-column: 2; }
.kind { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.k-test { background: var(--accent-soft); color: var(--accent); }
.k-code { background: var(--warn-soft); color: var(--warn); }
.k-decide { background: var(--bad-soft); color: var(--bad); }
.ncount { display: inline-block; margin-left: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.foot { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <div class="head-right">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="my" aria-pressed="true">မြန်မာ</button><button data-lang="en" aria-pressed="false">English</button>
      </div>
      <a href="/accept" id="back"></a>
    </div>
  </header>
  <div class="env" id="env"></div>
  <div class="note" id="note"></div>
  <div class="summary" id="summary"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="panel">
    <div class="bar"><div class="grow"><input id="q" type="search"></div><span class="foot" id="count"></span></div>
    <div class="story-head" id="storyHead" hidden></div>
    <div class="scroll"><table class="cases"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
  <p class="foot" id="foot"></p>
</div>
<script>
const DATA = /*DATA*/null;
const ST = ['covered', 'partial', 'none', 'not_built'];
const L = {
  my: {
    h1: 'AC Unit Test Coverage', back: '← Acceptance Cases', q: 'AC နံပါတ်၊ function ဒါမှမဟုတ် test အမည်နဲ့ ရှာပါ…',
    all: 'အားလုံး', total: 'AC စုစုပေါင်း',
    st: { covered: '✅ Unit test ရှိ', partial: '🟡 တစ်စိတ်', none: '❌ Test မရှိ', not_built: '⛔ Code မရှိ' },
    note: `Redmine Epic #22947 ရဲ့ Story ၁၁ ခုထဲက AC ၅၀ ခုကို project code နဲ့ တိုက်စစ်ထားပါတယ်။ AC တစ်ခုချင်းစီအတွက် ဘယ် function က လုပ်လဲ၊ ဘယ် unit test က တကယ် assert လုပ်လဲ ဆိုတာကို test code ကို ဖတ်ပြီး ဆုံးဖြတ်ထားပါတယ်။
      <ul><li><b>✅ Unit test ရှိ</b> — <code>go test</code> (live DB/Kafka/RT မလို) က AC ရဲ့ ရလဒ်နဲ့ အဓိက တန်ဖိုးတွေကို တိုက်ရိုက် စစ်တယ်။</li>
      <li><b>🟡 တစ်စိတ်</b> — test ရှိပေမယ့် AC ရဲ့ တစ်စိတ်တစ်ပိုင်းပဲ စစ်တယ်၊ ဒါမှမဟုတ် live service လိုတဲ့ integration test ပဲ ရှိတယ်။</li>
      <li><b>❌ Test မရှိ</b> — code ရှိပေမယ့် ဒီ behaviour ကို assert လုပ်တဲ့ unit test မရှိဘူး။</li>
      <li><b>⛔ Code မရှိ</b> — ဒီ AC ကို လုပ်တဲ့ code မတွေ့ဘူး။</li></ul>
      Live system ပေါ်က end-to-end စစ်ချက်တွေကတော့ Acceptance Cases page မှာ ရှိပါတယ်။`,
    th: ['AC', 'Story', 'Coverage', 'ဘာစစ်ရမလဲ', 'Tests'],
    needs: 'ပြည့်ဖို့ လိုတာ', kind: { test: '🧪 Test ရေး', code: '🛠 Code ပြင်', decide: '❓ ဆုံးဖြတ်' }, ncount: n => `လိုတာ ${n} ချက်`,
    how: 'Code က ဘယ်လို လုပ်လဲ', gap: 'ဘာ ကျန်သေးလဲ (✅ မဖြစ်ရတဲ့ အကြောင်း)', fn: 'လုပ်တဲ့ function / config',
    tests: 'Assert လုပ်တဲ့ unit test', notests: 'ဒီ AC ကို assert လုပ်တဲ့ unit test မရှိပါ', acen: 'AC မူရင်း (Redmine)',
    run: { pass: '✔ pass', fail: '✘ fail', unknown: '· run မတွေ့' },
    env: 'Unit test run', gen: 'ထုတ်ချိန်', foot: 'Test ရလဒ်တွေကို ဒီ page ထုတ်ချိန်မှာ go test -json နဲ့ run ထားတာပါ။ Code ပြောင်းရင် page ကို ပြန်ထုတ်ရပါမယ်။',
  },
  en: {
    h1: 'AC Unit Test Coverage', back: '← Acceptance Cases', q: 'Search AC, function or test name…',
    all: 'All', total: 'Total ACs',
    st: { covered: '✅ Unit-tested', partial: '🟡 Partial', none: '❌ No test', not_built: '⛔ Not built' },
    note: `The 50 acceptance criteria of the 11 Stories under Redmine Epic #22947, checked against the project code. For each AC the page shows the function that implements it and the unit tests that actually assert it (decided by reading the test bodies).
      <ul><li><b>✅ Unit-tested</b> — plain <code>go test</code> (no live DB/Kafka/RT) asserts the AC's outcome and key values.</li>
      <li><b>🟡 Partial</b> — tests cover only part of the AC, or only integration tests that need live services.</li>
      <li><b>❌ No test</b> — the code exists but no unit test asserts the behaviour.</li>
      <li><b>⛔ Not built</b> — no code implements the AC.</li></ul>
      End-to-end checks against the live system are on the Acceptance Cases page.`,
    th: ['AC', 'Story', 'Coverage', 'What must hold', 'Tests'],
    needs: 'To make it ✅', kind: { test: '🧪 Write a test', code: '🛠 Change code', decide: '❓ Decide' }, ncount: n => `${n} to do`,
    how: 'How the code does it', gap: 'What is missing', fn: 'Implemented by',
    tests: 'Unit tests that assert it', notests: 'No unit test asserts this AC', acen: 'AC (Redmine)',
    run: { pass: '✔ pass', fail: '✘ fail', unknown: '· not in run' },
    env: 'Unit test run', gen: 'Generated', foot: 'Test results come from a go test -json run when this page was generated. Regenerate the page after code changes.',
  },
};
const COLORS = { covered: 'var(--ok)', partial: 'var(--warn)', none: 'var(--bad)', not_built: 'var(--muted)' };
let lang = 'my', tab = 'all', filt = '', q = '';
const open = new Set();
try { lang = localStorage.getItem('cov-lang') || 'my'; } catch (e) {}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = id => document.getElementById(id);

function visible() {
  const s = q.trim().toLowerCase();
  return DATA.items.filter(i => (tab === 'all' || i.story === tab) && (!filt || i.status === filt) &&
    (!s || [i.ac, i.title, i.text, i.mm, i.how, i.gap, ...i.needs.map(x => x.mm + ' ' + x.en + ' ' + x.where), ...i.functions.map(f => f.name + ' ' + f.file), ...i.tests.map(t => t.name + ' ' + t.file)].join(' ').toLowerCase().includes(s)));
}

function render() {
  const T = L[lang];
  document.documentElement.lang = lang === 'my' ? 'my' : 'en';
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('h1').innerHTML = `${T.h1} <small>NOC-AUTO · ${DATA.items.length} AC</small>`;
  $('back').textContent = T.back;
  $('q').placeholder = T.q;
  $('note').innerHTML = T.note;
  $('env').innerHTML = DATA.env.map(e => `<span>${esc(e.name)} <b>${esc(e.git)}</b> · ${T.env} <b class="${e.run[1] ? 'bad' : 'ok'}">${e.run[0]} pass${e.run[1] ? ', ' + e.run[1] + ' fail' : ''}</b></span>`).join('') +
    `<span>${T.gen} <b>${esc(DATA.generated)}</b></span>`;

  const inTab = DATA.items.filter(i => tab === 'all' || i.story === tab);
  const cnt = st => inTab.filter(i => i.status === st).length;
  $('summary').innerHTML = `<button data-f="" aria-pressed="${!filt}"><div class="k">${T.total}</div><div class="v">${inTab.length}</div>
      <div class="meter">${ST.map(s => `<span style="width:${100 * cnt(s) / (inTab.length || 1)}%;background:${COLORS[s]}"></span>`).join('')}</div></button>` +
    ST.map(s => `<button data-f="${s}" aria-pressed="${filt === s}"><div class="k">${T.st[s]}</div><div class="v">${cnt(s)}</div></button>`).join('');
  $('summary').querySelectorAll('button').forEach(b => b.onclick = () => { filt = filt === b.dataset.f ? '' : b.dataset.f; render(); });

  $('tabs').innerHTML = `<button role="tab" data-t="all" aria-selected="${tab === 'all'}">${T.all}<span class="n">${DATA.items.length}</span></button>` +
    DATA.stories.map(s => `<button role="tab" data-t="${s.s}" aria-selected="${tab === s.s}" title="${esc(s.subject)}">${s.s}<span class="n">${DATA.items.filter(i => i.story === s.s && i.status === 'covered').length}/${DATA.items.filter(i => i.story === s.s).length}</span></button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

  const st = DATA.stories.find(s => s.s === tab);
  $('storyHead').hidden = !st;
  if (st) $('storyHead').innerHTML = `<b>${st.s}</b> · <a href="https://redmine-dev.frontiir.net/issues/${st.id}" target="_blank" rel="noopener">#${st.id}</a> · ${esc(lang === 'my' ? st.mm : st.subject)}`;

  $('thead').innerHTML = `<tr>${T.th.map((h, n) => `<th${n === 4 ? ' class="num"' : ''}>${h}</th>`).join('')}</tr>`;
  const rows = visible();
  $('count').textContent = `${rows.length} / ${DATA.items.length}`;
  $('tbody').innerHTML = rows.map(i => {
    const pass = i.tests.filter(t => t.state === 'pass').length;
    const row = `<tr class="row${open.has(i.ac) ? ' open' : ''}" data-ac="${i.ac}">
      <td class="id">${i.ac}</td><td class="id">${i.story}</td>
      <td><span class="pill p-${i.status}">${T.st[i.status]}</span>${i.needs.length ? `<span class="ncount">${T.ncount(i.needs.length)}</span>` : ''}</td>
      <td>${esc(lang === 'my' ? i.mm : i.title)}<span class="sub">${esc(lang === 'my' ? i.title : i.note)}</span></td>
      <td class="num">${i.tests.length ? `${pass}/${i.tests.length}` : '—'}</td></tr>`;
    return row + (open.has(i.ac) ? detail(i, T) : '');
  }).join('') || `<tr><td colspan="5" class="empty">—</td></tr>`;
  $('tbody').querySelectorAll('tr.row').forEach(r => r.onclick = () => { const a = r.dataset.ac; open.has(a) ? open.delete(a) : open.add(a); render(); });
  $('foot').textContent = T.foot;
}

function detail(i, T) {
  const fns = i.functions.length ? `<ul class="list">${i.functions.map(f => `<li><span class="repo">${esc(f.repo)}</span><b>${esc(f.name)}</b><br><span class="code">${esc(f.file)}${f.line ? ':' + f.line : ''}</span></li>`).join('')}</ul>` : `<p class="empty">—</p>`;
  const tests = i.tests.length ? `<ul class="list">${i.tests.map(t => `<li><span class="${t.state === 'pass' ? 'ok' : t.state === 'fail' ? 'bad' : 'dim'}">${T.run[t.state]}</span> <span class="repo">${esc(t.repo)}</span><b>${esc(t.name)}</b>
      <br><span class="code">${esc(t.file)}${t.line ? ':' + t.line : ''}</span><span class="sub">${esc(t.asserts)}</span></li>`).join('')}</ul>` : `<p class="empty">${T.notests}</p>`;
  const gap = i.status !== 'covered' && (lang === 'my' ? i.gap : i.note)
    ? `<div><h4>${T.gap}</h4><p class="gap${i.status === 'none' || i.status === 'not_built' ? ' none' : ''}">${esc(lang === 'my' ? i.gap : i.note)}</p></div>` : '';
  const needs = i.needs.length ? `<div><h4>${T.needs}</h4><ul class="list needs">${i.needs.map(x => `<li><span class="kind k-${x.kind}">${T.kind[x.kind]}</span><span>${esc(lang === 'my' ? x.mm : x.en)}</span>${x.where ? `<span class="where"><span class="code">${esc(x.where)}</span></span>` : ''}</li>`).join('')}</ul></div>` : '';
  return `<tr class="detail"><td colspan="5"><div class="det">
    <div><h4>${T.acen}</h4><p><b>${esc(i.title)}</b> — ${esc(i.text)}</p></div>
    ${lang === 'my' && i.how ? `<div><h4>${T.how}</h4><p>${esc(i.how)}</p></div>` : ''}
    ${gap}
    ${needs}
    <div><h4>${T.fn}</h4>${fns}</div>
    <div><h4>${T.tests}</h4>${tests}</div>
  </div></td></tr>`;
}

document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('cov-lang', lang); } catch (e) {} render(); });
$('q').oninput = e => { q = e.target.value; render(); };
render();
</script>
</body>
</html>
